# Give Gradle a generous heap. Android builds use a lot of memory and 1g default isn't enough.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Required for AndroidX. We aren't on legacy support libs.
android.useAndroidX=true

# Smaller resource artifacts -- each module gets its own R class.
android.nonTransitiveRClass=true

# Standard Kotlin code style.
kotlin.code.style=official
